# ==================================================================
# application-test.properties  —  overrides for the "test" Spring profile.
#
# Spring Boot automatically activates this file when the active profile
# is "test". @DataJpaTest sets it by default, so every repository test
# in this project uses these values instead of the ones in
# application.properties — meaning tests run against H2 in-memory, not
# a real PostgreSQL server.
#
# This keeps the test suite fast and self-contained: no Postgres
# installation required to run `mvn test`.
# ==================================================================

# ------------------------------------------------------------------
# DATABASE  (H2 in-memory — test profile only)
# ------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:bookstore_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop: wipe and recreate the schema for each test context.
# Dialect is auto-detected from the H2 JDBC URL — no explicit override needed.
spring.jpa.hibernate.ddl-auto=create-drop

# H2 console not needed in tests
spring.h2.console.enabled=false

# Seed file — not relevant for @DataJpaTest (tests build their own data),
# but BookstoreApplicationTests (@SpringBootTest) loads the full context;
# point to a path that exists so BookSeedLoader logs a warning rather than
# crashing. Tests build their own data anyway so an empty catalogue is fine.
bookstore.seed.file=../data/seed/books.json
