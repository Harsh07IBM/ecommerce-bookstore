# ==================================================================
# application.properties  —  runtime configuration for the Spring Boot app.
#
# Every line here is a "property" that Spring reads at startup. Spring's
# built-in code (called "auto-configuration") checks for these keys and
# adjusts its behaviour accordingly. Adding or changing a property tells
# Spring "here's how I want this piece of the framework to behave".
#
# Lines starting with `#` are comments — Spring ignores them.
# ==================================================================


# ------------------------------------------------------------------
# APPLICATION IDENTITY
# ------------------------------------------------------------------
# The logical name of this application. Appears in log lines like
# [bookstore]. Purely cosmetic — doesn't affect behaviour.
spring.application.name=bookstore


# ------------------------------------------------------------------
# HTTP SERVER
# ------------------------------------------------------------------
# The TCP port the embedded Tomcat server listens on. 8080 is Spring
# Boot's default — including it here as documentation. Change this if
# something else on your machine already uses 8080.
server.port=8080


# ------------------------------------------------------------------
# DATABASE  (H2 in-memory)
# ------------------------------------------------------------------
# The JDBC connection URL. Reading "jdbc:h2:mem:bookstore" piece by piece:
#   jdbc       - JDBC scheme (Java Database Connectivity — Java's way of
#                talking to any relational database)
#   h2         - use the H2 database engine
#   mem        - keep everything in memory (nothing is written to disk;
#                the whole DB vanishes when the app stops)
#   bookstore  - a name for this in-memory DB (used in logs)
spring.datasource.url=jdbc:h2:mem:bookstore

# Which JDBC driver class to load. For H2, always this one.
spring.datasource.driver-class-name=org.h2.Driver

# H2's default admin username is "sa" (system administrator) with no password.
# Fine for a local in-memory DB — never leave a real DB like this in production.
spring.datasource.username=sa
spring.datasource.password=


# ------------------------------------------------------------------
# JPA / HIBERNATE  (the object-to-database mapping layer)
# ------------------------------------------------------------------
# What Hibernate should do with our @Entity classes at startup.
#   create-drop = "wipe any existing schema, create fresh tables from
#                  our entity annotations, then drop them on shutdown."
# Perfect for a dev setup with an in-memory DB. NEVER use create-drop in
# production — you would lose every row every time the app restarts.
# Other options for later: `none`, `validate`, `update`.
spring.jpa.hibernate.ddl-auto=create-drop

# Print every SQL statement Hibernate issues to the log. Extremely useful
# when learning — you can literally SEE the SELECT / INSERT / UPDATE
# generated by every findAll / save / findById call.
spring.jpa.show-sql=true

# Pretty-print the printed SQL (indented, multi-line) instead of one long
# messy line. Only takes effect when show-sql is true.
spring.jpa.properties.hibernate.format_sql=true


# ------------------------------------------------------------------
# H2 WEB CONSOLE  (a browser UI for inspecting the in-memory database)
# ------------------------------------------------------------------
# H2 ships with a small web UI. Enabling it lets us visit
#   http://localhost:8080/h2-console
# in a browser and browse tables, run SELECT queries, etc. Useful for
# verifying that entities map to the tables we expect, and later that
# the seed loader has populated the data correctly.
#
# Only enable this in development — never on a public server. It exposes
# raw database access.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------
# Log everything in OUR own package at DEBUG level (verbose). Third-party
# libraries stay at their default (INFO) — no noise. When we start adding
# `log.debug(...)` calls in our own code, they'll show up in the console.
logging.level.com.harsh.bookstore=DEBUG


# ------------------------------------------------------------------
# APPLICATION-SPECIFIC  (our own custom properties)
# ------------------------------------------------------------------
# Where the seed JSON file lives on disk. Used by BookSeedLoader in Phase 5.
#
# The path is relative to the JVM's WORKING DIRECTORY when the app starts.
# Convention: run the backend from the `backend/` folder, e.g.
#
#     cd backend
#     mvn spring-boot:run
#
# From `backend/`, the string `../data/seed/books.json` walks up one folder
# (to the repo root) and down into `data/seed/`, landing exactly where the
# Python script wrote the file in Phase 2.
#
# If the file is not found at this path (e.g. someone ran the app from a
# different folder), the loader logs a warning and starts with an empty
# catalogue — it does NOT crash the app.
bookstore.seed.file=../data/seed/books.json
