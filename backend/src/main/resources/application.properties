# ==================================================================
# application.properties  —  runtime configuration for the Spring Boot app.
# ==================================================================


# ------------------------------------------------------------------
# APPLICATION IDENTITY
# ------------------------------------------------------------------
spring.application.name=bookstore


# ------------------------------------------------------------------
# HTTP SERVER
# ------------------------------------------------------------------
server.port=${PORT:8080}

# Return 404 (not 500) when no controller is mapped to a request path.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false


# ------------------------------------------------------------------
# DATABASE  (PostgreSQL)
# ------------------------------------------------------------------
# Credentials are read from environment variables — never hardcoded.
# Set these before starting the application:
#
#   DB_URL      e.g. jdbc:postgresql://localhost:5432/bookstore
#   DB_USERNAME e.g. bookstore_user
#   DB_PASSWORD e.g. your-secure-password
#
# For local development you can create a .env file or export them
# in your shell before running `mvn spring-boot:run`.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookstore}
spring.datasource.username=${DB_USERNAME:bookstore_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


# ------------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------------
# Let Hibernate auto-detect the dialect from the JDBC URL / driver.
# This avoids hard-coding a dialect here, which would break @DataJpaTest
# tests that override the datasource to use H2.
# spring.jpa.database-platform is intentionally NOT set here.

# update: apply any missing columns/tables on startup but never drop data.
# This is safe for development. Use validate + Flyway migrations for production.
spring.jpa.hibernate.ddl-auto=update

# Log every SQL statement Hibernate issues (useful during development).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------
logging.level.com.harsh.bookstore=DEBUG


# ------------------------------------------------------------------
# APPLICATION-SPECIFIC
# ------------------------------------------------------------------
# Path to the seed JSON file (relative to the working directory when
# the app starts — run from the `backend/` folder).
bookstore.seed.file=../data/seed/books.json


# ------------------------------------------------------------------
# JWT
# ------------------------------------------------------------------
# Secret key for HMAC-SHA256 token signing.
# MUST be overridden via the JWT_SECRET environment variable before
# any non-local deployment. The fallback value here is for local
# development only — never use it in staging or production.
bookstore.jwt.secret=${JWT_SECRET:bookstore-dev-secret-key-change-in-production-min32c}

# Token lifetime: 86400000 ms = 24 hours.
bookstore.jwt.expiration-ms=86400000
